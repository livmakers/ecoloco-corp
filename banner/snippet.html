.eco-bn .leaf{position:absolute;opacity:.13;pointer-events:none;width:15%;transform-origin:50% 100%;animation:ecoSway 8s ease-in-out infinite}
.eco-bn .l1{left:30%;top:-8%}.eco-bn .l2{right:30%;bottom:-12%;animation-direction:reverse}
.eco-bn .petal{position:absolute;width:9px;height:13px;background:#e9b9b0;border-radius:80% 0 80% 0;opacity:0;animation:ecoFall 10s linear infinite}
.eco-bn .p1{left:36%}.eco-bn .p2{left:52%;animation-delay:4s}.eco-bn .p3{left:64%;animation-delay:7s}
.eco-bn .in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.1cqw;padding:0 8%}
.eco-bn .logo{width:min(40cqw,480px);height:auto;animation:ecoRise 1.2s ease both}
.eco-bn .cat{font-family:"Zen Old Mincho","Yu Mincho",serif;font-weight:500;font-size:clamp(12px,2.4cqw,29px);letter-spacing:.16em;color:var(--green);animation:ecoRise 1.2s .25s ease both}
.eco-bn .pill{font-family:"Zen Old Mincho","Yu Mincho",serif;font-weight:700;font-size:clamp(11px,1.9cqw,23px);letter-spacing:.1em;color:#fff;background:var(--green);padding:.55em 1.6em;border-radius:999px;animation:ecoRise 1.2s .5s ease both}
.eco-bn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);transform:translateX(-100%);animation:ecoShine 7s 2s ease-in-out infinite;pointer-events:none}
@keyframes ecoRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ecoSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes ecoZoom{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes ecoFall{0%{top:-10%;opacity:0}10%{opacity:.8}90%{opacity:.6}100%{top:110%;opacity:0;transform:rotate(240deg)}}
@keyframes ecoShine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.eco-bn,.eco-bn *,.eco-bn::after{animation:none!important;transition:none!important}.eco-bn .petal{display:none}.eco-bn::after{display:none}}
